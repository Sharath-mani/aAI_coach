services:
  essay-api:
    build: .
    command: uvicorn fastapi_app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  quiz-api:
    build: .
    command: uvicorn quiz_fastapi_app:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  prq-api:
    build: .
    command: uvicorn para_read_fastapi:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build: .
    command: uvicorn api_gateway:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    depends_on:
      - essay-api
      - quiz-api
      - prq-api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agenix
      POSTGRES_USER: agenix
      POSTGRES_PASSWORD: agenix_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenix -d agenix"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
